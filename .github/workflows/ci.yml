name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Check Alembic schema
        run: python -m alembic -c backend/alembic.ini check

  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm test --prefix frontend -- --run

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Type-check
        run: npm run typecheck --prefix frontend

      - name: Build admin workspace
        run: npm run build --prefix frontend

      - name: Build public intake
        run: npm run build:public --prefix frontend
