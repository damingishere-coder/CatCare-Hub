<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#FF9500" />
    <meta name="description" content="CatCare-Hub 客户资料填写" />
    <title>CatCare 客户资料填写</title>
    <style>
      .cc-public-boot{box-sizing:border-box;min-height:100vh;margin:0;padding:32px 20px;background:#fff9f1;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
      .cc-public-boot__card{max-width:560px;margin:0 auto;padding:28px;border:1px solid #ffedd5;border-radius:30px;background:#fff;box-shadow:0 18px 50px rgba(120,72,20,.08)}
      .cc-public-boot__mark{display:grid;width:48px;height:48px;place-items:center;border-radius:16px;background:#ffedd5;color:#c2410c;font-size:24px}
      .cc-public-boot__eyebrow{margin:20px 0 8px;color:#c2410c;font-size:12px;font-weight:700;letter-spacing:.16em}
      .cc-public-boot__title{margin:0;font-size:28px;line-height:1.25}
      .cc-public-boot__copy{margin:14px 0 0;color:#64748b;font-size:14px;line-height:1.7}
      .cc-public-boot__bar{height:6px;margin-top:24px;overflow:hidden;border-radius:999px;background:#ffedd5}
      .cc-public-boot__bar::after{display:block;width:45%;height:100%;border-radius:inherit;background:#ff9500;content:"";animation:cc-public-boot 1.1s ease-in-out infinite alternate}
      @keyframes cc-public-boot{from{transform:translateX(-20%)}to{transform:translateX(150%)}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="cc-public-boot" aria-live="polite" aria-label="CatCare 客户资料正在加载">
        <section class="cc-public-boot__card">
          <span class="cc-public-boot__mark" aria-hidden="true">🐱</span>
          <p class="cc-public-boot__eyebrow">CATCARE · 客户登记</p>
          <h1 class="cc-public-boot__title">正在打开填写资料</h1>
          <p class="cc-public-boot__copy">页面马上就好，请稍候…</p>
          <div class="cc-public-boot__bar" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <script type="module" src="../src/public-main.tsx"></script>
  </body>
</html>
